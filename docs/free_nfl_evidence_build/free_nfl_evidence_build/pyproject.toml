[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-nfl-evidence"
version = "0.1.0"
description = "Standalone public-data evidence layer for 2010-2014 NFL career simulation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.scripts]
free-nfl-evidence = "free_nfl_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
