<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="578" viewBox="0 0 1280 578" role="img" aria-labelledby="title desc">
<title id="title">Contract desk: four offers and a reserved fifth matching position</title>
<desc id="desc">Fictional example, not historical offers. Miami A1: $12.3 million guaranteed under offer, $18.9 million potential; Lakers B1: $17.325 million guaranteed and potential; Boston C1: $6.4 million unconditional, $12.8 million potential with player option; New York D1: $7 million for one year. Fifth matching position is inactive for this unrestricted free agent. All signing routes are unverified.</desc>
<rect width="1280" height="578" rx="18" fill="#0E1420"/>
<text x="28" y="39" fill="#BAC7D8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">CONTRACT DESK · JULY 16, 2003 · FICTIONAL EXAMPLE</text>
<text x="28" y="85" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Four proposals. Every term stays visible.</text>
<text x="28" y="118" fill="#BAC7D8" font-family="Arial, Helvetica, sans-serif" font-size="19">Example Player, 24 · Unrestricted free agent · Gross USD · No offer accepted</text>
<g transform="translate(28 147)">
<rect width="291" height="323" rx="12" fill="#1B2434" stroke="#344257" stroke-width="1"/>
<path d="M12 0h267q12 0 12 12v74H0V12Q0 0 12 0" fill="#98002E"/>
<rect y="84" width="291" height="5" fill="#F9A01B"/>
<text x="18" y="29" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">POSITION 1 · A1</text>
<text x="18" y="65" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">MIA</text>
<text x="274" y="62" text-anchor="end" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15">OWN CLUB</text>
<text x="18" y="123" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">2 years + team option</text>
<text x="18" y="151" fill="#BDCADB" font-family="Arial, Helvetica, sans-serif" font-size="16">Guaranteed under offered terms*</text>
<text x="18" y="192" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">$12.3M</text>
<line x1="18" y1="211" x2="273" y2="211" stroke="#43516A"/>
<text x="18" y="237" fill="#BDCADB" font-family="Arial, Helvetica, sans-serif" font-size="16">Potential base across full term</text>
<text x="18" y="269" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">$18.9M</text>
<text x="18" y="303" fill="#BDCADB" font-family="Arial, Helvetica, sans-serif" font-size="17">Club controls year 3</text>
</g>
